<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore SPA</title>

    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- ================= HEADER ================= -->

    <header>

        <div class="logo">
            <h1>🛒 TechStore</h1>
            <p>Todo para Gamers y Tech Lovers</p>
        </div>

        <div class="busqueda">

            <input
                type="search"
                id="buscar"
                placeholder="Buscar un producto..."
            >

        </div>

    </header>

    <!-- ================= CATEGORIAS ================= -->

    <nav class="categorias">

        <button class="activo" data-categoria="Todos">
            Todos
        </button>

        <button data-categoria="Laptop">
            Laptops
        </button>

        <button data-categoria="Celular">
            Celulares
        </button>

        <button data-categoria="Gaming">
            Gaming
        </button>

        <button data-categoria="Accesorios">
            Accesorios
        </button>

    </nav>

    <!-- ================= CONTENIDO ================= -->

    <main>

        <!-- Productos -->

        <section id="productos">

            <!-- JavaScript genera todas las tarjetas -->

        </section>

        <!-- Panel lateral -->

        <aside id="detalle">

            <h2>Información del Producto</h2>

            <div id="detalleContenido">

                <img
                    src="https://placehold.co/400x300"
                    alt="Producto"
                >

                <h3>Seleccione un producto</h3>

                <p>
                    Aquí aparecerá la información del producto
                    seleccionado.
                </p>

            </div>

        </aside>

    </main>

    <!-- ================= FOOTER ================= -->
    <footer>

        <p>
            TechStore SPA - Proyecto de JavaScript
        </p>

    </footer>

    <script src="script.js"></script>

</body>¿
</html>
